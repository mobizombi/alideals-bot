<!doctype html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 440px; height: 280px;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #ff6a00 0%, #ff9248 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center;
  }
  .icon { font-size: 56px; margin-bottom: 8px; }
  h1 { font-size: 30px; font-weight: 800; margin: 0 0 8px; }
  p { font-size: 15px; margin: 0; opacity: .95; }
</style>
</head>
<body>
  <div class="icon">🛍️</div>
  <h1>מציאון</h1>
  <p>הדילים הכי חמים מאליאקספרס, כל יום בדפדפן</p>
</body>
</html>
